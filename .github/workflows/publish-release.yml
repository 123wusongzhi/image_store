name: Prepare lossless image folders

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract current image bundle
        run: |
          rm -rf cats dogs _tmp_assets
          mkdir -p _tmp_assets
          unzip -o animal-assets.zip -d _tmp_assets

      - name: Convert to lossless WebP without additional pixel loss
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path('_tmp_assets')
          for group in ('cats', 'dogs'):
              src_dir = root / group
              dst_dir = Path(group)
              dst_dir.mkdir(parents=True, exist_ok=True)
              for src in sorted(src_dir.glob('*.jpg')):
                  im = Image.open(src).convert('RGB')
                  dst = dst_dir / (src.stem + '.webp')
                  im.save(dst, 'WEBP', lossless=True, method=6, quality=100, exact=True)
                  check = Image.open(dst).convert('RGB')
                  if im.size != check.size or im.tobytes() != check.tobytes():
                      raise RuntimeError(f'Pixel verification failed: {src}')
                  print(f'verified: {src} -> {dst}')
          PY
          rm -rf _tmp_assets

      - name: Commit image folders
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cats dogs
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
          else
            git commit -m 'Add lossless WebP animal images'
            git push
          fi
