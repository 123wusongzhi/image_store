name: Publish animal assets release

on:
  push:
    branches: [main]
    paths:
      - 'animal-assets.zip'
      - '.github/workflows/publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" animal-assets.zip --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" animal-assets.zip \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Animal Assets v1.0.0" \
              --notes "5 cat images and 3 dog images, organized in cats/ and dogs/."
          fi
